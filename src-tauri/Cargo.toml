[package]
name = "vienna"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
default-run = "vienna"

[features]
default = []
dev-bridge = []

[lib]
name = "vienna_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.40", features = ["bundled"] }
reqwest = { version = "0.13", features = ["json"] }
sha2 = "0.10"

[[bin]]
name = "vienna"
path = "src/main.rs"

[[bin]]
name = "vienna-bridge"
path = "src/bridge.rs"
required-features = ["dev-bridge"]
